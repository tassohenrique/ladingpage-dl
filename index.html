<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celso Dal Lago — Medicina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F6;
    --surface:#FFFFFF;
    --ink:#132229;
    --muted:#57696D;
    --line:#D6DFDE;
    --accent:#2F6F68;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    line-height:1.55;
  }
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}
  h1{
    font-family:"Fraunces", Georgia, serif;
    font-weight:500;
    line-height:1.06;
    letter-spacing:-0.01em;
    margin:0;
  }
  .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  a{color:inherit;}

  .nav{
    border-bottom:1px solid var(--line);
  }
  .nav .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:68px;
  }
  .nav .brand{
    font-family:"Fraunces", serif;
    font-weight:500;
    font-size:19px;
    text-decoration:none;
  }
  .nav .brand em{font-style:italic; color:var(--accent);}

  .hero{ border-bottom:1px solid var(--line); }
  .hero .wrap{ padding:64px 32px 56px; }
  .hero h1{ font-size:clamp(40px, 6.4vw, 68px); margin-top:18px; }
  .hero h1 em{ font-style:italic; color:var(--accent); }
  .hero p.lede{ margin:20px 0 0; max-width:46ch; font-size:18px; color:var(--muted); }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="#top">Celso <em>Dal Lago</em></a>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <span class="eyebrow">Medicina · UNIDERP, Campo Grande – MS</span>
    <h1>Um olhar atento<br>para o que a <em>imagem</em><br>revela.</h1>
    <p class="lede">Celso Dal Lago é médico formado com um compromisso simples: cuidar de cada pessoa com atenção, estudo constante e a certeza de que a medicina é, antes de tudo, um ato de amor.</p>
  </div>
</header>

</body>
</html>
